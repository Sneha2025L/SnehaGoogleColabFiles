name: Execute Notebook

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill nbformat nbconvert

      - name: Execute notebook with papermill
        run: |
          mkdir -p ./executed
          papermill notebooks/IcrecreamAnalysis/Copy_of_Getting_started_with_google_colab_ai.ipynb executed/Copy_of_Getting_started_with_google_colab_ai-executed.ipynb --log-output
      - name: Upload executed notebook as artifact
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed/Copy_of_Getting_started_with_google_colab_ai-executed.ipynb
